.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 18px}.brand{font-weight:950;letter-spacing:.17em;font-size:1.13rem}.brand span{color:var(--lime)}.date{color:var(--muted);font-size:.8rem;text-align:right}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-size:.68rem;font-weight:800;margin-bottom:7px}.hero{border:1px solid #2c3a50;border-radius:25px;padding:21px;background:linear-gradient(135deg,#151f31dd,#0c111de8);position:relative;overflow:hidden;box-shadow:0 14px 50px #0005}.hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #c6ff3d20;border-radius:50%;right:-60px;top:-55px;box-shadow:0 0 0 24px #c6ff3d08,0 0 0 50px #2de2ff06}.hero h1{font-size:clamp(1.8rem,7vw,2.65rem);line-height:1;letter-spacing:-.06em;margin:0 0 10px;max-width:85%}.sub{color:var(--muted);line-height:1.45;font-size:.9rem}.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:.72rem;color:#d7e0f3;background:#ffffff05}.pill.stage{border-color:var(--accent,var(--lime));color:var(--accent,var(--lime))}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:24px 2px 12px}.sectionhead h2{font-size:1.1rem;letter-spacing:-.03em;margin:0}.sectionhead small{color:var(--muted)}.card{background:linear-gradient(145deg,#121a2a,#0d1320);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:11px}.card h3{margin:0 0 7px;font-size:1rem}.card p{margin:5px 0;color:var(--muted);font-size:.86rem;line-height:1.45}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.wrap{flex-wrap:wrap}.tag{font-size:.7rem;border-radius:7px;padding:5px 7px;background:#c6ff3d14;color:var(--lime);font-weight:800}.muted{color:var(--muted)}.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);padding:10px 13px;background:#ffffff08;font-weight:750}.btn.primary{background:var(--lime);border-color:var(--lime);color:#0b1006}.btn.ghost{background:transparent}.btn.small{min-height:36px;padding:7px 10px;font-size:.78rem}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:16px;background:#ffffff04}.stat strong{font-size:1.45rem;letter-spacing:-.04em;display:block}.stat span{font-size:.73rem;color:var(--muted)}.progress{height:7px;border-radius:20px;background:#ffffff10;overflow:hidden;margin:10px 0 4px}.progress i{height:100%;display:block;width:0;background:linear-gradient(90deg,var(--lime),var(--cyan));border-radius:20px;transition:width .25s}.workout{border-left:3px solid var(--accent,var(--lime))}.exercise{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:11px 0;border-top:1px solid #ffffff0d}.exercise:first-of-type{border-top:0}.exercise input{width:20px;height:20px;accent-color:var(--lime);margin-top:2px}.exercise label{font-size:.88rem;font-weight:750}.exercise small{display:block;color:var(--muted);font-size:.76rem;line-height:1.4;margin-top:4px}.exercise.done label{text-decoration:line-through;color:var(--muted)}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:9px 8px calc(8px + var(--safeB));background:#080c16ee;backdrop-filter:blur(22px);border-top:1px solid #273148;display:flex;justify-content:center}.tabs{display:grid;grid-template-columns:repeat(6,1fr);width:min(850px,100%);gap:2px}.tab{border:0;background:transparent;border-radius:12px;min-height:54px;color:var(--muted);font-size:.67rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab b{font-size:1.12rem;font-weight:500}.tab.active{background:#c6ff3d12;color:var(--lime)}.dayrow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff0d}.dayrow:last-child{border-bottom:0}.daybadge{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#ffffff09;font-weight:850}.dayrow.today .daybadge{background:var(--lime);color:#101506}.dayrow strong{font-size:.87rem}.dayrow p{margin:3px 0 0;font-size:.75rem}.status{font-size:.68rem;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:.8rem;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:#080d17;color:var(--text);border-radius:11px;padding:12px;min-height:44px}textarea{min-height:80px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.timer{font-size:2.4rem;font-weight:900;letter-spacing:-.06em}.notice{border:1px solid #2de2ff50;background:#2de2ff0a;border-radius:14px;padding:13px;font-size:.82rem;line-height:1.5;color:#d9faff}.notice.warn{border-color:#ff9d4260;background:#ff9d420b;color:#ffe4c8}.notice.good{border-color:#c6ff3d50;background:#c6ff3d0a;color:#eaffc1}.chart{width:100%;height:150px;background:#080d17;border:1px solid var(--line);border-radius:14px;display:block}.hidden{display:none!important}.checkline{display:flex;align-items:center;gap:10px;font-size:.86rem;margin:10px 0}.checkline input{width:20px}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn.selected{border-color:var(--lime);color:var(--lime);background:#c6ff3d0d}.toast{position:fixed;bottom:calc(88px + var(--safeB));left:50%;transform:translateX(-50%);background:#eaffc1;color:#11170a;padding:11px 16px;border-radius:99px;font-size:.82rem;font-weight:800;z-index:40;box-shadow:0 5px 30px #0008;max-width:90%;text-align:center}.smalltext{font-size:.75rem;color:var(--muted);line-height:1.5}.ringwrap{display:flex;align-items:center;gap:16px}.ring{width:82px;height:82px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime) var(--pct,0%),#ffffff10 0);position:relative}.ring:before{content:"";position:absolute;inset:7px;background:#101624;border-radius:50%}.ring strong{position:relative;font-size:.9 <script>
const START='2026-10-19', END='2027-07-11';
const stages=[
{name:'Calisthenics foundation',start:'2026-10-19',end:'2026-12-20',color:'#c6ff3d',focus:'Handstand skill, size, strength, easy running.',ratio:'70% strength / 30% running',miles:[14,15,16,12,16,17,18,13,15]},
{name:'Balanced development',start:'2026-12-21',end:'2027-03-14',color:'#2de2ff',focus:'Keep building, add one weekly quality run, start one-arm prep.',ratio:'55% strength / 45% running',miles:[18,19,20,16,21,22,23,18,24,25,26,20]},
{name:'Running preparation',start:'2027-03-15',end:'2027-05-23',color:'#ff9d42',focus:'Two quality runs, build toward an 8-mile long run, maintain strength.',ratio:'35% strength / 65% running',miles:[27,28,29,23,30,31,32,25,33,34]},
{name:'Summer transition',start:'2027-05-24',end:'2027-07-11',color:'#ff55d7',focus:'Peak base, sharpen, arrive at preseason fresh.',ratio:'25% strength / 75% running',miles:[28,33,34,35,29,36,30]}
];
const miles1=[[3,3,3,5],[3,4,3,5],[4,4,3,5],[3,3,2,4],[4,4,3,5],[4,4,3,6],[4,5,3,6],[3,3,3,4],[3,4,3,5]];
const miles2=[[4,4,3,2,5],[4,4,3,3,5],[4,5,3,2,6],[3,3,3,2,5],[4,5,3,3,6],[4,5,4,3,6],[5,5,4,3,6],[4,4,3,2,5],[5,5,4,3,7],[5,6,4,3,7],[5,6,4,4,7],[4,4,3,3,6]];
const miles3=[[5,4,3,5,3,7],[6,4,3,5,3,7],[6,4,4,5,3,7],[5,3,3,4,2,6],[6,4,4,5,3,8],[6,4,4,6,3,8],[6,5,4,6,3,8],[5,3,3,4,3,7],[7,5,4,6,3,8],[7,5,4,6,3,9]];
const miles4=[[5,4,3,5,3,8],[6,5,4,6,3,9],[7,5,4,6,3,9],[7,5,5,6,3,9],[5,4,4,5,3,8],[7,5,5,6,3,10],[5,5,4,4,3,9]];
const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.floor((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000);
const defaultData={version:1,preseason:'2027-07-12',dateOverride:'',units:'mi',sound:true,logs:[],checks:{},attempts:[],bestHold:0,level:1,readiness:null,notes:[],dismissedInstall:false};
let data;try{data={...defaultData,...JSON.parse(localStorage.getItem('ascent-v1')||'{}')}}catch(e){data={...defaultData}}
let tab='today',timerInt=null,timerLeft=0,activeTimer=null;
function save(){localStorage.setItem('ascent-v1',JSON.stringify(data))}
function nowISO(){return data.dateOverride||iso(new Date())}
function getInfo(date=nowISO()){
 let day=dayDiff(date,START), stageIndex=day<0?-1:day>dayDiff(END,START)?4:stages.findIndex(s=>date>=s.start&&date<=s.end);
 if(stageIndex<0)return {day,stageIndex,week:0,dow:new Date(date+'T12:00:00').getDay()};
 let st=stages[stageIndex],week=Math.floor(dayDiff(date,st.start)/7)+1;
 return {day,stageIndex,stage:st,week,dow:new Date(date+'T12:00:00').getDay()};
}
function planMiles(info){if(info.stageIndex<0||info.stageIndex>3)return 0;return stages[info.stageIndex].miles[Math.min(info.week-1,stages[info.stageIndex].miles.length-1)]||0}
function dailyRun(info,dow){
 let mi=info.stageIndex,w=info.week-1,sets=[miles1,miles2,miles3,miles4][mi];if(!sets)return 0;
 let row=sets[Math.min(w,sets.length-1)];
 if(mi===0)return ({2:row[0],5:row[1],6:row[2],0:row[3]})[dow]||0;
 if(mi===1)return ({2:row[0],3:row[1],5:row[2],6:row[3],0:row[4]})[dow]||0;
 return ({2:row[0],3:row[1],4:row[2],5:row[3],6:row[4],0:row[5]})[dow]||0;
}
function deload(info){return [4,8,12].includes(info.week)&&info.stageIndex===1||[4,8].includes(info.week)&&(info.stageIndex===0||info.stageIndex===2)||info.stageIndex===3&&info.week===5}
function getWorkout(date){
 let info=getInfo(date), dow=new Date(date+'T12:00:00').getDay(), run=dailyRun(info,dow), items=[];
 if(info.stageIndex<0||info.stageIndex>3)return {info,run:0,items:[],title:'Preseason mode'};
 let s=info.stageIndex;
 const add=(title,desc,exercises=[],type='session')=>items.push({id:`${date}-${items.length}`,title,desc,exercises,type});
 if(s===0){
  if(dow===1){add('Handstand block','22 min · skill first',handstand());add('Strength A · Push','~40 min',strengthA())}
  if(dow===2)add('Easy run','Conversational pace · 4 relaxed strides',runItems(run), 'run');
  if(dow===3){add('Handstand block','20 min · skill first',handstand());add('Strength B · Pull + arms','~40 min',strengthB())}
  if(dow===4)add('Strength C · Lower + core','~35 min',strengthC());
  if(dow===5){add('Short handstand block','10–12 min',handstand(true));add('Easy run','Conversational pace · 4 relaxed strides',runItems(run),'run')}
  if(dow===6){add('Easy run','Optional 15-min upper pump finisher; flexible on game days',runItems(run),'run')}
  if(dow===0){add('Long easy run','Easy effort · mobility after',runItems(run),'run');add('Mobility','5 min',mobility())}
 }else if(s===1){
  if(dow===1){add('Handstand block','22 min',handstand());add('Strength A · Push','~35 min',strengthA2());add('One-arm prep','8 min · stop for wrist/shoulder pain',oneArm())}
  if(dow===2)add('Easy run + core','Conversational pace',runItems(run).concat(core()),'run');
  if(dow===3){add('Quality run','Hills or tempo depending on week',quality2(info), 'quality');add('Strength B · Pull + arms','~35 min',strengthB2())}
  if(dow===4){add('Short handstand block','10–12 min',handstand(true));add('Strength C · Lower','~30 min',strengthC2())}
  if(dow===5){add('Short handstand block','15 min',handstand(true));add('Easy run + strides','Conversational pace',runItems(run),'run')}
  if(dow===6)add('Easy run or rest','Optional 10-min handstand practice if fresh',runItems(run),'run');
  if(dow===0){add('Long run','Easy effort · mobility after',runItems(run),'run');add('Mobility','5 min',mobility())}
 }else if(s===2){
  if(dow===1){add('Handstand block','15 min',handstand(true));add('Strength U1 · Upper','~35 min',upper1())}
  if(dow===2)add('Quality run 1 · Threshold','Warm-up + workout + cool-down',threshold(info),'quality');
  if(dow===3){add('Easy run + core','Conversational pace',runItems(run).concat(core()),'run');add('Strength L · Lower','~30 min',lower())}
  if(dow===4){add('Short handstand block','12 min',handstand(true));add('Easy run','Conversational pace',runItems(run),'run');add('Strength U2 · Short pull','~20 min',upper2())}
  if(dow===5)add('Quality run 2 · Speed','Warm-up + intervals + cool-down',speed(info),'quality');
  if(dow===6){add('Easy run or rest','Optional 10-min handstand practice',runItems(run),'run')}
  if(dow===0){add('Long run','Easy effort · mobility after',runItems(run),'run');add('Mobility','5 min',mobility())}
 }else{
  if(dow===1){add('Handstand block','12 min',handstand(true));add('Upper maintenance','25 min',upperMaint())}
  if(dow===2)add('Quality run 1 · Tempo','Warm-up + tempo + cool-down',tempo4(info),'quality');
  if(dow===3){add('Easy run + core','Conversational pace',runItems(run).concat(core()),'run');add('Lower maintenance','20 min',lowerMaint())}
  if(dow===4){add('Short handstand block','10 min',handstand(true));add('Easy run','Conversational pace',runItems(run),'run')}
  if(dow===5)add('Quality run 2 · Hills / fartlek','Alternate hills and 5K-effort fartlek',quality4(info),'quality');
  if(dow===6)add('Easy run or rest','Optional short handstand practice',runItems(run),'run');
  if(dow===0){add('Long run','Easy effort · mobility after',runItems(run),'run');add('Mobility','5 min',mobility())}
 }
 return {info,run,items,title:stages[s].name};
}
function ex(name,detail,cue=''){return {name,detail,cue}}
function handstand(short=false){let a=[ex('Bail drill','2 min · 3 controlled exits per side','Know how to come down before balancing.'),ex('Chest-to-wall hold',short?'2 × 30 s':'3 × 30–45 s','Hands 20–30 cm from wall; push tall, ribs in, glutes tight.'),ex('Heel/toe pulls','4 × 5 per side · 1–2 s','Shift slowly; keep shoulders stacked.'),ex('Weight shifts','3 × 8','Move pressure gradually between hands.'),ex('Back-to-wall kick-ups','6–10 quality attempts','Soft heel tap; small kick if overshooting.')];return short?a.slice(0,2).concat(a.slice(2,3),a.slice(4)):a.concat(ex('Easy chest-to-wall hold','1 × 30 s','Finish with clean position.'))}
function strengthA(){return [ex('Wall HSPU negatives','4 × 3 · 4 s lowering · rest 150 s','Elbows ~45°; head lands on folded towel/pad.'),ex('Pike push-ups','3 × 8–10 · rest 120 s','Feet on 30–45 cm box; hips high.'),ex('Parallel-bar dips','3 × 6–10 · rest 90 s','Shoulders down, slight forward lean.'),ex('Decline push-ups','3 × 10–12 · rest 75 s','Hollow body, elbows ~45°.'),ex('Dumbbell lateral raises','3 × 12–15 · rest 60 s','Lead with elbows, stop at shoulder height.'),ex('Band triceps pressdowns','2 × 15 · rest 45 s'),ex('Prone Y-T-W','2 × 8 each, light')]} 
function strengthA2(){return [ex('Wall HSPU negatives / partials','3 × 3–5 · rest 150 s'),ex('Dips','3 × 8–12 · rest 90 s'),ex('Deficit pike push-ups','3 × 6–10 · rest 120 s'),ex('Dumbbell lateral raises','2 × 15 · rest 60 s'),ex('Scapular push-ups','2 × 12'),ex('Prone Y-T-W','2 × 8 each')]} 
function strengthB(){return [ex('Pull-ups','4 × 4–8 · rest 120 s','Assisted if needed; dead hang, no kipping.'),ex('Ring / inverted rows','4 × 8–12 · rest 90 s','Straight body; pull to lower chest.'),ex('One-arm dumbbell rows','3 × 10 per side · rest 75 s'),ex('Face pulls / band pull-aparts','3 × 15 · rest 45 s'),ex('Prone Y-T-W','3 × 8 each'),ex('Dumbbell / ring curls','3 × 10–12 · rest 60 s'),ex('Hammer curls','2 × 12 · rest 60 s'),ex('Hanging knee raises','3 × 8–12 · rest 60 s','No swinging; curl pelvis up.')]} 
function strengthB2(){return [ex('Pull-ups','4 × 5–8 · rest 120 s'),ex('Ring / inverted rows','3 × 8–12 · rest 90 s'),ex('One-arm dumbbell rows','2 × 10 per side · rest 75 s'),ex('Face pulls','3 × 15 · rest 45 s'),ex('Curls','2 × 10–12 · rest 60 s'),ex('Hanging knee raises','3 × 8–12 · rest 60 s'),ex('Prone Y-T-W','2 × 8 each')]} 
function strengthC(){return [ex('Squat','4 × 6–8 · rest 120 s','Stop 2 reps short of failure.'),ex('Romanian deadlift','3 × 8–10 · rest 90 s','Hips back, flat back.'),ex('Reverse lunges','3 × 8 per leg · rest 90 s'),ex('Glute bridges','3 × 15 · rest 60 s'),ex('Calf raises','3 × 12–15 straight + 2 × 15 bent · rest 60 s'),ex('Hollow-body hold','3 × 20–30 s'),ex('Dead bug','3 × 8 per side')]} 
function strengthC2(){return [ex('Squat','3 × 6–8 · rest 120 s'),ex('Romanian deadlift','2 × 8–10 · rest 90 s'),ex('Step-ups / reverse lunges','3 × 8 per leg · rest 90 s'),ex('Single-leg glute bridge','3 × 10 per leg · rest 60 s'),ex('Calf raises','3 × 12 · rest 60 s'),ex('Hollow-body hold','3 × 25 s')]} 
function oneArm(){return [ex('Light fingertip wall touch','2–3 × 5–8 s per side','Chest-to-wall; keep it low volume.'),ex('Two-arm weight shifts','3 × 6 per side','Stop at any wrist or shoulder pain.')]} 
function core(){return [ex('Hollow-body hold','3 × 20–25 s'),ex('Dead bug','3 × 8 per side'),ex('Side plank','2 × 25 s per side'),ex('Glute bridge march','2 × 10')]} 
function mobility(){return [ex('Hip flexor / calf / hamstring stretch','30 s each side'),ex('Thoracic extension over foam roller','8 reps'),ex('Wrist flexor/extensor stretch','30 s each')]} 
function runItems(mi){return [ex('Run',''+mi+' mi · fully conversational effort','Plan paces are estimates; effort beats pace.'),ex('Cool-down mobility','5 min','Hip flexor, calf, hamstring, thoracic extension.')]} 
function quality2(i){let w=i.week;let text=w<=4?'6–8 × 10–12 s hard uphill, jog down':w<=8?'2 × 8 min tempo at ~7:10–7:25/mi, 2 min jog':'15–20 min continuous tempo or 3 × 8 min with 90 s jog';if(deload(i))text='Deload: halve the workout volume.';return [ex('Warm-up','Included in planned mileage · easy'),ex('Main set',text),ex('Cool-down','Easy jog to planned mileage')]} 
function threshold(i){let w=i.week;let text=({1:'3 × 8 min',2:'3 × 10 min',3:'2 × 15 min',5:'25 min continuous',6:'2 × 12 min',7:'3 × 10 min',9:'30 min continuous',10:'30 min continuous'})[w]||'Threshold workout reduced for deload';if(deload(i))text='Deload: halve volume';return [ex('Warm-up','1 mi easy'),ex('Threshold set',text+' at ~7:10–7:25/mi; jog 2 min between reps'),ex('Cool-down','1 mi easy')]} 
function speed(i){let w=i.week;let t=w<=3?'6–8 × 400 m at ~1:35–1:40; 90 s jog':w<=7?'5–6 × 800 m at ~3:15–3:22; 2 min jog':'3 × 1 mile at 6:35–6:50 (3 min jog), or 4–5 × 1000 m';if(deload(i))t='Deload: cut reps by about one-third';return [ex('Warm-up','Easy running; part of ~6 mi total'),ex('Intervals',t,'Keep final repeat within 3–4 s per 400 m of the first.'),ex('Cool-down','Easy jog to planned mileage')]}

 document.querySelectorAll('[data-mark-session]').forEach(b=>b.onclick=()=>{let date=b.dataset.date;data.checks[date]??={};let w=getWorkout(date),it=w.items.find(x=>x.id===b.dataset.markSession);if(it)it.exercises.forEach((e,j)=>data.checks[date][checkKey(date,it,j)]=true);save();render();toast('Session marked complete')});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 const sr=document.getElementById('saveReadiness');if(sr)sr.onclick=()=>{let sleep=document.getElementById('sleep').value,soreness=document.getElementById('soreness').value,hsfeel=document.getElementById('hsfeel').value,red=soreness==='sick'||hsfeel==='pain'||sleep==='very',yellow=!red&&(sleep==='short'||soreness==='heavy'||hsfeel==='off');data.readiness={date:nowISO(),sleep,soreness,hsfeel,color:red?'red':yellow?'yellow':'green',title:red?'Rest / stop painful skill work':yellow?'Adjust today':'Train as planned',message:red?'Rest if sick or very sore. Stop handstands if there is pain; do not train through sharp pain.':yellow?'Cut strength volume by about a third and swap quality running for easy running. If this continues 3+ days, take an extra deload.':'Sleep, legs, and handstands feel normal. Train as planned, while keeping easy runs easy.'};save();render()};
 const sn=document.getElementById('saveNote');if(sn)sn.onclick=()=>{let text=document.getElementById('quickNote').value.trim();if(text){data.notes.push({date:nowISO(),text});save();render();toast('Note saved')}};
 const p=document.getElementById('prevWeek');if(p)p.onclick=()=>{data.dateOverride=addDays(nowISO(),-7);save();render()};
 const n=document.getElementById('nextWeek');if(n)n.onclick=()=>{data.dateOverride=addDays(nowISO(),7);save();render()};
 const tw=document.getElementById('thisWeek');if(tw)tw.onclick=()=>{data.dateOverride='';save();render()};
 document.querySelectorAll('[data-attempt]').forEach(b=>b.onclick=()=>logAttempt(b.dataset.attempt));
 const lh=document.getElementById('logHold');if(lh)lh.onclick=()=>{let v=Number(document.getElementById('holdInput').value);if(v>0){data.bestHold=Math.max(data.bestHold,v);data.attempts.push({date:nowISO(),result:'hold',label:'Freestanding hold',seconds:v});save();render();toast('Hold saved')}};
 const sl=document.getElementById('startStopwatch');if(sl)sl.onclick=()=>{if(timerInt){clearInterval(timerInt);timerInt=null;sl.textContent='Resume stopwatch';return}let started=Date.now()-(timerLeft||0);timerInt=setInterval(()=>{timerLeft=Date.now()-started;let el=document.getElementById('stopwatch');if(el)el.innerHTML=(timerLeft/1000).toFixed(1)+'<span style="font-size:1rem"> s</span>'},100)};
 const rs=document.getElementById('resetStopwatch');if(rs)rs.onclick=()=>{clearInterval(timerInt);timerInt=null;timerLeft=0;let el=document.getElementById('stopwatch');if(el)el.innerHTML='0.0<span style="font-size:1rem"> s</span>';if(sl)sl.textContent='Start stopwatch'};
 const lev=document.getElementById('saveLevel');if(lev)lev.onclick=()=>{data.level=Number(document.getElementById('levelSelect').value);save();render();toast('Level updated')};
 const lf=document.getElementById('logForm');if(lf)lf.onsubmit=e=>{e.preventDefault();data.logs.push({id:Date.now(),date:document.getElementById('logDate').value,type:document.getElementById('logType').value,distance:Number(document.getElementById('distance').value)||0,pace:document.getElementById('pace').value,effort:document.getElementById('effort').value,metric:document.getElementById('metric').value,note:document.getElementById('logNote').value});save();render();toast('Workout saved')};
 document.querySelectorAll('[data-delete-log]').forEach(b=>b.onclick=()=>{data.logs=data.logs.filter(l=>String(l.id)!==b.dataset.deleteLog);save();render()});
 const sf=document.getElementById('settingsForm');if(sf)sf.onsubmit=e=>{e.preventDefault();data.preseason=document.getElementById('preseason').value||defaultData.preseason;data.dateOverride=document.getElementById('dateOverride').value;data.units=document.getElementById('units').value;data.sound=document.getElementById('sound').checked;save();render();toast('Settings saved')};
 const exb=document.getElementById('export');if(exb)exb.onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ascent-backup-'+nowISO()+'.json';a.click();URL.revokeObjectURL(a.href)};
 const imp=document.getElementById('importFile');if(imp)imp.onchange=async()=>{try{let f=imp.files[0],j=JSON.parse(await f.text());if(!j||typeof j!=='object'||!Array.isArray(j.logs))throw Error('Invalid backup');data={...defaultData,...j};save();render();toast('Backup imported')}catch(e){alert('Could not import that backup. Choose a valid ASCENT JSON export.')}};
 const reset=document.getElementById('resetData');if(reset)reset.onclick=()=>{if(confirm('Delete all ASCENT data stored on this device? Export a backup first if you want to keep it.')){localStorage.removeItem('ascent-v1');data={...defaultData};save();render()}};
 const dis=document.getElementById('dismissInstall');if(dis)dis.onclick=()=>{data.dismissedInstall=true;save();render()};
}
function logAttempt(result){let recent=data.attempts.filter(a=>a.date===nowISO()).length;let failed=0;for(let a of [...data.attempts].reverse()){if(a.date!==nowISO())break;if(a.result==='soft'||a.result==='hold')break;failed++}if(recent>=10){alert('10 attempts logged. Stop kick-ups for today and finish with chest-to-wall holds.');return}if(failed>=2){alert('Two failed attempts in a row. Stop kick-ups and finish with chest-to-wall holds.');return}data.attempts.push({date:nowISO(),result,label:({A:'Came up short',B:'Overshot',C:'Tired / form drop',soft:'Soft tap'})[result]});save();render();if(result==='C')toast('Form dropped — stop kick-ups if tired.');else toast('Attempt logged')}
function startTimer(seconds){clearInterval(timerInt);timerLeft=seconds*1000;let end=Date.now()+timerLeft;toast('Rest timer started: '+seconds+' seconds');timerInt=setInterval(()=>{timerLeft=Math.max(0,end-Date.now());let sec=Math.ceil(timerLeft/1000);document.title=sec?`Rest ${sec}s · ASCENT`:'Rest complete · ASCENT';if(sec===0){clearInterval(timerInt);timerInt=null;if(data.sound){try{let ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.1;o.start();o.stop(ctx.currentTime+.25)}catch(e){}}if(navigator.vibrate)navigator.vibrate([150,80,150]);toast('Rest complete — next set');document.title='ASCENT — Training OS'}},250)}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2300)}
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body></html>
